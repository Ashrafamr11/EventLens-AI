
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "eventlens-ai"
version = "0.1.0"
description = "Audio-Visual Event Localization System"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]
